<style>
/* Layout: one narrow column. Home is four big colour tiles, then one game per screen. */
:root {
  --bg: #F3EFFA;
  --surface: #FFFFFF;
  --ink: #20192F;
  --muted: #665E7C;
  --line: #DDD5EE;
  --brand: #4A2FD6;
  --brand-on: #FFFFFF;
  --kitty: #C2307F;
  --kitty-on: #FFFFFF;
  --couple: #D9452B;
  --couple-on: #FFFFFF;
  --drinks: #F2B01E;
  --drinks-on: #20192F;
  --house: #12857A;
  --house-on: #FFFFFF;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15101F; --surface: #221A33; --ink: #F4EFFF; --muted: #AAA0C4; --line: #3B2F54;
    --brand: #8F7BFF; --brand-on: #150F22;
    --kitty: #F06BAE; --kitty-on: #1B1428;
    --couple: #FF8467; --couple-on: #1B1428;
    --drinks: #F5B93A; --drinks-on: #1B1428;
    --house: #3CC4B5; --house-on: #1B1428;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15101F; --surface: #221A33; --ink: #F4EFFF; --muted: #AAA0C4; --line: #3B2F54;
  --brand: #8F7BFF; --brand-on: #150F22;
  --kitty: #F06BAE; --kitty-on: #1B1428;
  --couple: #FF8467; --couple-on: #1B1428;
  --drinks: #F5B93A; --drinks-on: #1B1428;
  --house: #3CC4B5; --house-on: #1B1428;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--body);
}
.app { --c: var(--brand); --on: var(--brand-on); }
.wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.wrap > * { min-width: 0; }

h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.wordmark { font: 800 clamp(46px, 14vw, 68px)/0.95 var(--display); letter-spacing: -0.035em; }
.title { font: 800 clamp(30px, 9vw, 42px)/1 var(--display); letter-spacing: -0.03em; }
.lede { color: var(--muted); font-size: 17px; max-width: 46ch; }
.label { font: 700 12px var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.small { color: var(--muted); font-size: 14px; }
.rule { font-size: 16px; max-width: 52ch; }
.notice { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: var(--muted); }

.dots { display: flex; }
.dots i { width: 18px; height: 18px; border-radius: 50%; margin-right: -6px; border: 2px solid var(--bg); }
.dots i:nth-child(1) { background: var(--kitty); }
.dots i:nth-child(2) { background: var(--couple); }
.dots i:nth-child(3) { background: var(--drinks); }
.dots i:nth-child(4) { background: var(--house); }

.bar { display: flex; align-items: center; gap: 12px; }
.back {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px;
  border-radius: 999px; text-decoration: none; color: var(--ink);
  font: 600 15px var(--body); box-shadow: inset 0 0 0 2px var(--line);
}

a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.btn {
  font: 700 16px/1 var(--body); min-height: 52px; padding: 0 22px; border-radius: 14px; border: 0;
  background: var(--c); color: var(--on); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: 1 1 140px;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.btn.alt { background: var(--ink); color: var(--bg); }
.btn.small-btn { min-height: 44px; flex: 0 0 auto; padding: 0 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 42px; padding: 0 16px; border-radius: 999px; cursor: pointer;
  border: 2px solid var(--line); background: transparent; color: var(--ink); font: 600 14px var(--body);
}
.chip[aria-pressed="true"] { background: var(--c); color: var(--on); border-color: var(--c); }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile {
  display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 184px;
  padding: 16px; border-radius: 24px; text-decoration: none; background: var(--tc); color: var(--ton);
}
.tile h3 { font: 800 clamp(23px, 6.6vw, 30px)/1 var(--display); letter-spacing: -0.02em; }
.tile p { font-size: 14px; line-height: 1.35; }
.tile .count { font: 700 13px var(--body); letter-spacing: 0.04em; }

.rows { display: flex; flex-direction: column; gap: 10px; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 16px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
  text-decoration: none; color: var(--ink);
}
.row h3 { font: 700 20px/1.15 var(--display); letter-spacing: -0.01em; }
.row p { color: var(--muted); font-size: 14px; grid-column: 1; }
.row .meta { font: 600 12px var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--c); grid-column: 1; }
.row .go { grid-column: 2; grid-row: 1 / span 3; font: 700 22px var(--display); color: var(--c); }

.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.addrow { display: flex; gap: 8px; }
.addrow input {
  flex: 1 1 auto; min-width: 0; min-height: 44px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 0 12px; font: 500 16px var(--body);
}
.pchip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 6px 0 14px; border-radius: 999px; background: var(--bg); border: 2px solid var(--line); font-weight: 600; font-size: 14px; }
.pchip button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }

.card {
  background: var(--surface); border: 2px solid var(--line); border-radius: 26px; padding: 20px;
  min-height: 300px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px;
}
.card .tag {
  align-self: flex-start; background: var(--c); color: var(--on); font: 700 12px var(--body);
  letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 10px; border-radius: 8px;
}
.card-text { font: 700 clamp(24px, 6.6vw, 34px)/1.2 var(--display); letter-spacing: -0.015em; text-wrap: balance; }
.card-foot { color: var(--muted); font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.ball {
  width: 168px; height: 168px; border-radius: 50%; background: var(--c); color: var(--on);
  display: grid; place-items: center; font: 800 80px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.04em;
}
.callrow { display: flex; align-items: center; gap: 18px; }
.callrow > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.nick { font: 700 20px/1.2 var(--display); }
.board { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.cell {
  aspect-ratio: 1; display: grid; place-items: center; font: 600 12px var(--body); font-variant-numeric: tabular-nums;
  border-radius: 6px; background: var(--surface); color: var(--muted); border: 1px solid var(--line);
}
.cell.on { background: var(--c); color: var(--on); border-color: var(--c); font-weight: 700; }
.cell.last { outline: 3px solid var(--ink); outline-offset: 1px; }
.recent { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
.recent span { font: 700 14px var(--body); font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 999px; border: 2px solid var(--line); }

.timer { font: 800 56px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.bigletter { font: 800 150px/1 var(--display); letter-spacing: -0.04em; color: var(--c); }
.score { font: 700 15px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }

.wheelbox { display: flex; justify-content: center; }
.wheel {
  position: relative; width: min(88vw, 360px); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%; border: 2px solid var(--line); background: var(--surface);
}
.wname {
  position: absolute; transform: translate(-50%, -50%); max-width: 22%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 600 13px var(--body); padding: 3px 6px; border-radius: 8px;
}
.wheel.dense .wname { font-size: 11px; padding: 2px 4px; }
.wname.win { background: var(--c); color: var(--on); font-weight: 800; }
.arrow { position: absolute; inset: 0; transition: transform 3.6s cubic-bezier(0.12, 0.7, 0.1, 1); }
.arrow::before { content: ""; position: absolute; left: 50%; top: 16%; width: 8px; height: 34%; margin-left: -4px; background: var(--c); border-radius: 4px 4px 0 0; }
.arrow::after { content: ""; position: absolute; left: 50%; top: 12%; margin-left: -11px; border-left: 11px solid transparent; border-right: 11px solid transparent; border-bottom: 18px solid var(--c); }
.hub { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--ink); }
.result { font: 800 clamp(26px, 8vw, 36px)/1.1 var(--display); letter-spacing: -0.02em; min-height: 1.1em; text-align: center; }

[hidden] { display: none !important; }
.roombar {
  max-width: 620px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px 12px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
  font: 600 14px var(--body); color: var(--ink);
}
.roombar .code { font: 800 18px var(--display); letter-spacing: 0.12em; }
.roombar .sp { flex: 1 1 auto; }
.roombar button {
  min-height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line);
  background: transparent; color: var(--ink); font: 600 13px var(--body); cursor: pointer;
}
.bigcode { font: 800 clamp(48px, 16vw, 72px)/1 var(--display); letter-spacing: 0.14em; color: var(--c); }
.err { color: var(--couple); font-weight: 600; font-size: 14px; }
.addrow input.codein { text-transform: uppercase; letter-spacing: 0.2em; font-weight: 700; max-width: 150px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

      turnEl.textContent = curName() ? "Turn: " + curName() : ""; pubLetter();
    }
    root.appendChild(el("div", { class: "stack" }, [
      el("div", { class: "card" }, [
        el("span", { class: "tag" }, ["Sing a song starting with"]),
        letterEl,
        el("div", { class: "stack" }, [timerEl, turnEl])
      ]),
      el("div", { class: "actions" }, [startBtn, el("button", { class: "btn", type: "button", onclick: next }, ["Next letter"])])
    ]));
  }

  function spinScreen(root) {
    var rot = 0, busy = false, timer = null;
    setCleanup(function () { clearTimeout(timer); });
    function build() {
      root.textContent = "";
      var list = plist();
      var n = list.length;
      publish({ kind: "card", tag: "Spin to Pick", text: "The host is about to spin.", foot: "" });
      if (n < 2) {
        root.appendChild(el("div", { class: "stack" }, [
          el("p", { class: "rule" }, [room.on ? "Waiting for friends to join the room." : "Add at least two names to spin."]),
          playersEditor(build)
        ]));
        return;
      }
      var wheel = el("div", { class: "wheel" + (n > 8 ? " dense" : "") });
      var names = [];
      list.forEach(function (p, i) {
        var a = i * 2 * Math.PI / n;
        var s = el("span", { class: "wname", style: "left:" + (50 + 38 * Math.sin(a)).toFixed(2) + "%;top:" + (50 - 38 * Math.cos(a)).toFixed(2) + "%" }, [p]);
        names.push(s); wheel.appendChild(s);
      });
      var arrow = el("div", { class: "arrow" });
      wheel.appendChild(arrow);
      wheel.appendChild(el("div", { class: "hub" }));
      var result = el("p", { class: "result", "aria-live": "polite" }, ["Tap spin to pick one person."]);
      var btn = el("button", { class: "btn", type: "button" }, ["Spin"]);
      btn.addEventListener("click", function () {
        if (busy) return;
        busy = true; btn.disabled = true;
        names.forEach(function (x) { x.classList.remove("win"); });
        result.textContent = "…";
        var target = Math.floor(Math.random() * n), seg = 360 / n;
        var m = ((rot % 360) + 360) % 360;
        var delta = (((target * seg - m) % 360) + 360) % 360;
        rot += 360 * 5 + delta;
        arrow.style.transform = "rotate(" + rot + "deg)";
        timer = setTimeout(function () {
          names[target].classList.add("win");
          result.textContent = list[target] + ", you are up.";
          publish({ kind: "card", tag: "Spin to Pick", text: list[target] + ", you are up.", foot: "" });
          busy = false; btn.disabled = false;
        }, reduce() ? 200 : 3800);
      });
      root.appendChild(el("div", { class: "stack" }, [
        el("div", { class: "wheelbox" }, [wheel]),
        result,
        el("div", { class: "actions" }, [btn]),
        (room.on ? null : el("div", { class: "panel" }, [el("p", { class: "label" }, ["Players"]), playersEditor(build)]))
      ]));
    }
    build();
  }

  function setCleanup(fn) { cleanup = fn; }

  /* ---------- views ---------- */
  function homeView() {
    var tiles = el("div", { class: "tiles" });
    ORDER.forEach(function (k) {
      var c = CATS[k];
      tiles.appendChild(el("a", { class: "tile", href: "#" + k, style: "--tc:var(--" + k + ");--ton:var(--" + k + "-on)" }, [
        el("div", { class: "stack", style: "gap:8px" }, [el("h3", null, [c.name]), el("p", null, [c.blurb])]),
        el("span", { class: "count" }, [c.games.length + " games →"])
      ]));
    });
    return el("div", { class: "wrap" }, [
      el("div", { class: "stack", style: "gap:12px" }, [
        el("div", { class: "dots", "aria-hidden": "true" }, [el("i"), el("i"), el("i"), el("i")]),
        el("h1", { class: "wordmark" }, ["Playroom"]),
        el("p", { class: "lede" }, ["Party games for one phone and a few friends."])
      ]),
      roomPanel(),
      room.on ? null : el("div", { class: "panel" }, [
        el("p", { class: "label" }, ["Who is playing"]),
        el("p", { class: "small" }, ["Optional. Names are used for turns and dares. They stay on this phone."]),
        playersEditor()
      ]),
      el("div", { class: "stack" }, [el("p", { class: "label" }, ["Pick a mood"]), tiles]),
      el("p", { class: "small" }, ["Play on one phone, or open a room so every friend sees each card on their own phone."])
    ]);
  }

  function gateView(backHash, guest) {
    return el("div", { class: "wrap", style: colorStyle("drinks") }, [
      guest ? null : topbar(backHash, "Back"),
      el("h1", { class: "title" }, ["Adults only"]),
      el("p", { class: "rule" }, ["These games involve alcohol. Continue only if you are of legal drinking age where you live. The legal age is different in each Indian state."]),
      el("div", { class: "notice" }, ["Sipping is always optional. Water counts. Nobody should drink more than they want, and nobody should drive after drinking."]),
      el("div", { class: "actions" }, [
        guest ? el("button", { class: "btn ghost", type: "button", onclick: leaveRoom }, ["Leave room"]) : el("a", { class: "btn ghost", href: "#" + backHash, style: "text-decoration:none" }, ["Take me back"]),
        el("button", { class: "btn", type: "button", onclick: function () {
          state.adult = true;
          try { sessionStorage.setItem("playroom.adult", "1"); } catch (e) {}
          render();
        } }, ["I am of legal drinking age"])
      ])
    ]);
  }

  function categoryView(key) {
    var c = CATS[key];
    state.ctx = key;
    if (c.adult && !state.adult) return gateView("");
    var rows = el("div", { class: "rows" });
    c.games.forEach(function (gid) {
      var g = GAMES[gid];
      rows.appendChild(el("a", { class: "row", href: "#game-" + gid }, [
        el("h3", null, [g.name]),
        el("p", null, [g.blurb]),
        el("span", { class: "meta" }, [g.meta]),
        el("span", { class: "go", "aria-hidden": "true" }, ["→"])
      ]));
    });
    return el("div", { class: "wrap", style: colorStyle(key) }, [
      topbar("", "All games"),
      el("div", { class: "stack", style: "gap:8px" }, [el("h1", { class: "title" }, [c.name]), el("p", { class: "lede" }, [c.blurb])]),
      rows
    ]);
  }

  function gameView(gid) {
    var g = GAMES[gid];
    if (!g) { location.hash = ""; return el("div"); }
    var cat = catFor(gid);
    curCat = cat;
    if (g.adult && !state.adult) return gateView(cat);
    var body = el("div", { class: "stack" });
    var parts = [
      topbar(cat, CATS[cat].name),
      el("div", { class: "stack", style: "gap:8px" }, [el("h1", { class: "title" }, [g.name])])
    ];
    if (g.rule) parts.push(el("p", { class: "rule" }, [g.rule]));
    if (g.adult) parts.push(el("div", { class: "notice" }, ["Sipping is optional. Water counts. Nobody drinks more than they want."]));
    parts.push(body);
    if (g.kind === "deck") deckScreen(g, body);
    else if (g.kind === "tod") todScreen(body);
    else if (g.kind === "tambola") tambolaScreen(body);
    else if (g.kind === "charades") charadesScreen(body);
    else if (g.kind === "antakshari") antakshariScreen(body);
    else if (g.kind === "spin") spinScreen(body);
    return el("div", { class: "wrap", style: colorStyle(cat) }, parts);
  }

  /* ---------- rooms ---------- */
  function canRoom() { return location.protocol === "http:" || location.protocol === "https:"; }
  function myName() { try { return localStorage.getItem("playroom.myname") || ""; } catch (e) { return ""; } }
  function saveName(v) { try { localStorage.setItem("playroom.myname", v); } catch (e) {} }
  function plist() { return (room.on && room.host && room.players.length) ? room.players : state.players; }
  function roomSend(o) { if (room.ws && room.ws.readyState === 1) room.ws.send(JSON.stringify(o)); }
  function publish(view) {
    view.cat = curCat;
    room.view = view;
    if (room.on && room.host) roomSend({ t: "show", view: view });
  }
  function stopPing() { if (pingTimer) { clearInterval(pingTimer); pingTimer = null; } }
  function startPing() { stopPing(); pingTimer = setInterval(function () { roomSend({ t: "ping" }); }, 25000); }

  function updateRoomBar() {
    var bar = document.getElementById("roombar");
    if (!bar) return;
    bar.textContent = "";
    if (!room.on) { bar.hidden = true; return; }
    bar.hidden = false;
    bar.appendChild(el("span", { class: "code" }, [room.code]));
    bar.appendChild(el("span", null, [room.players.length + (room.players.length === 1 ? " player" : " players") + (room.host ? " · you are the host" : "")]));
    bar.appendChild(el("span", { class: "sp" }));
    bar.appendChild(el("button", { type: "button", onclick: leaveRoom }, [room.host ? "Close room" : "Leave"]));
  }

  function leaveRoom() {
    var ws = room.ws;
    room.on = false; room.host = false; room.code = ""; room.players = []; room.view = null;
    room.err = ""; room.connecting = false; room.ws = null;
    stopPing();
    if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
    state.joinCode = "";
    updateRoomBar();
    if (location.hash && location.hash !== "#") location.hash = ""; else render();
  }

  function connect(first) {
    if (room.connecting || room.on) return;
    room.err = ""; room.connecting = true; render();
    var ws;
    try { ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host); }
    catch (e) { room.err = "Could not connect."; room.connecting = false; render(); return; }
    room.ws = ws;
    ws.onopen = function () { ws.send(JSON.stringify(first)); startPing(); };
    ws.onmessage = function (ev) { var m; try { m = JSON.parse(ev.data); } catch (e) { return; } onRoomMsg(m); };
    ws.onclose = function () {
      stopPing();
      var was = room.on, wasHost = room.host;
      room.on = false; room.host = false; room.ws = null; room.connecting = false; room.players = []; room.code = "";
      if (was) room.err = wasHost ? "Connection lost. Your room has closed." : "Disconnected from the room.";
      else if (!room.err) room.err = "Could not connect. The server may be waking up, so try again in a minute.";
      updateRoomBar(); render();
    };
  }

  function onRoomMsg(m) {
    if (m.t === "joined") {
      room.on = true; room.connecting = false; room.host = !!m.host; room.code = m.code;
      room.players = m.players || []; room.view = m.view || null; room.err = ""; state.joinCode = "";
      updateRoomBar();
      if (location.hash && location.hash !== "#") location.hash = ""; else render();
    } else if (m.t === "players") {
      room.players = m.players || [];
      updateRoomBar();
      if (room.host) { var r = location.hash.replace("#", ""); if (!r || r === "home") render(); }
    } else if (m.t === "show") {
      if (!room.host) { room.view = m.view; render(); }
    } else if (m.t === "error") {
      room.err = m.msg || "Something went wrong.";
      room.connecting = false;
      var ws = room.ws; room.ws = null;
      if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
      stopPing();
      render();
    } else if (m.t === "closed") {
      leaveRoom();
      room.err = "The host closed the room.";
      render();
    }
  }

  function roomPanel() {
    var panel = el("div", { class: "panel" });
    if (!canRoom()) {
      panel.appendChild(el("p", { class: "label" }, ["Play together"]));
      panel.appendChild(el("p", { class: "small" }, ["Rooms work on the live website, not in a preview or a saved file."]));
      return panel;
    }
    if (room.on) {
      var link = location.origin + "/#join-" + room.code;
      var copyBtn = el("button", { class: "btn ghost", type: "button" }, ["Copy link"]);
      copyBtn.addEventListener("click", function () {
        try {
          navigator.clipboard.writeText(link).then(
            function () { copyBtn.textContent = "Copied"; },
            function () { copyBtn.textContent = "Select the link above"; }
          );
        } catch (e) { copyBtn.textContent = "Select the link above"; }
      });
      var chips = el("div", { class: "chips" });
      room.players.forEach(function (p) { chips.appendChild(el("span", { class: "pchip" }, [p])); });
      panel.appendChild(el("p", { class: "label" }, ["Your room"]));
      panel.appendChild(el("div", { class: "bigcode", "aria-label": "Room code" }, [room.code]));
      panel.appendChild(el("p", { class: "small" }, ["Friends open this link, or go to the site and type the code."]));
      panel.appendChild(el("p", { class: "small", style: "word-break:break-all" }, [link]));
      panel.appendChild(chips);
      panel.appendChild(el("div", { class: "actions" }, [
        el("a", { class: "btn", style: "text-decoration:none", target: "_blank", rel: "noopener",
          href: "https://wa.me/?text=" + encodeURIComponent("Join my Playroom game. Open " + link + " or enter code " + room.code) }, ["Share on WhatsApp"]),
        copyBtn
      ]));
      panel.appendChild(el("p", { class: "small" }, ["Now open any game below. Every phone in the room shows each card as you play."]));
      return panel;
    }
    var nameIn = el("input", { id: "myname", type: "text", maxlength: "16", placeholder: "Your name", autocomplete: "off", "aria-label": "Your name", value: myName() });
    var codeIn = el("input", { id: "joincode", class: "codein", type: "text", maxlength: "4", placeholder: "CODE", autocomplete: "off", "aria-label": "Room code", value: state.joinCode });
    var createBtn = el("button", { class: "btn", type: "button" }, ["Create room"]);
    var joinBtn = el("button", { class: "btn small-btn", type: "button" }, ["Join"]);
    if (room.connecting) { createBtn.disabled = true; joinBtn.disabled = true; }
    function nameVal() {
      var v = nameIn.value.replace(/\s+/g, " ").trim().slice(0, 16);
      if (v) saveName(v);
      return v;
    }
    createBtn.addEventListener("click", function () {
      var nm = nameVal();
      if (!nm) { room.err = "Enter your name first."; render(); return; }
      connect({ t: "create", name: nm });
    });
    joinBtn.addEventListener("click", function () {
      var nm = nameVal();
      var cd = codeIn.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
      state.joinCode = cd;
      if (!nm) { room.err = "Enter your name first."; render(); return; }
      if (cd.length !== 4) { room.err = "Enter the 4 letter room code."; render(); return; }
      connect({ t: "join", code: cd, name: nm });
    });
    panel.appendChild(el("p", { class: "label" }, ["Play together"]));
    panel.appendChild(el("p", { class: "small" }, ["Everyone plays on their own phone. One person creates a room, the others join with the code."]));
    panel.appendChild(el("div", { class: "addrow" }, [nameIn]));
    panel.appendChild(el("div", { class: "actions" }, [createBtn]));
    panel.appendChild(el("div", { class: "addrow" }, [codeIn, joinBtn]));
    if (room.connecting) panel.appendChild(el("p", { class: "small", "aria-live": "polite" }, ["Connecting. The first connection can take up to a minute while the server wakes up."]));
    if (room.err) panel.appendChild(el("p", { class: "err", "aria-live": "polite" }, [room.err]));
    return panel;
  }

  function guestView() {
    var v = room.view || { kind: "idle", text: "Waiting for the host to pick a game." };
    if (v.adult && !state.adult) return gateView("", true);
    var parts = [
      el("div", { class: "stack", style: "gap:8px" }, [
        el("h1", { class: "title" }, ["Room " + room.code]),
        el("p", { class: "lede" }, ["Playing: " + room.players.join(", ")])
      ])
    ];
    if (v.kind === "number") {
      var called = v.called || [];
      var board = el("div", { class: "board" });
      for (var i = 1; i <= 90; i++) {
        board.appendChild(el("div", { class: "cell" + (called.indexOf(i) > -1 ? " on" : "") + (i === v.n ? " last" : "") }, [String(i)]));
      }
      parts.push(el("div", { class: "stack" }, [
        el("div", { class: "callrow" }, [
          el("div", { class: "ball", "aria-live": "polite" }, [v.n ? String(v.n) : "–"]),
          el("div", null, [el("p", { class: "nick" }, [v.nick || ""]), el("p", { class: "score" }, [v.count || ""])])
        ]),
        board
      ]));
    } else if (v.kind === "card") {
      parts.push(el("div", { class: "card", "aria-live": "polite" }, [
        el("span", { class: "tag" }, [v.tag || "Playroom"]),
        el("p", { class: "card-text" }, [v.text || ""]),
        el("p", { class: "card-foot" }, [v.foot || ""])
      ]));
    } else {
      parts.push(el("div", { class: "card", "aria-live": "polite" }, [
        el("span", { class: "tag" }, ["Playroom"]),
        el("p", { class: "card-text" }, [v.text || "Waiting for the host."]),
        el("p", { class: "card-foot" }, [""])
      ]));
    }
    return el("div", { class: "wrap", style: colorStyle(v.cat || "kitty") }, parts);
  }

  function render() {
    if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
    app.textContent = "";
    var r = location.hash.replace("#", "") || "home";
    updateRoomBar();
    if (room.on && !room.host) { app.appendChild(guestView()); return; }
    var view;
    if (CATS[r]) view = categoryView(r);
    else if (r.indexOf("game-") === 0) view = gameView(r.slice(5));
    else {
      if (r.indexOf("join-") === 0) state.joinCode = r.slice(5).toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
      view = homeView();
    }
    app.appendChild(view);
    if (room.on && room.host && r.indexOf("game-") !== 0) publish({ kind: "idle", text: "The host is choosing the next game." });
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>

</html>
