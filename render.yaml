services:
  - type: web
    name: duo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: duo-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: duo-db
    plan: basic-256mb
