# Launch setup: free plans in Singapore (closest to India).
# Before real users: change the web plan to "starter" and the database plan to "basic-256mb"
# (free Render databases expire after 30 days and free web services sleep when idle).
services:
  - type: web
    name: duo
    runtime: node
    plan: free
    region: singapore
    branch: duo
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: duo-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      # Optional: add ANTHROPIC_API_KEY in the Render dashboard to turn on AI date ideas.

databases:
  - name: duo-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
